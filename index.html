<script>
const img = document.getElementById('catImg');
const status = document.getElementById('status');
let isLoading = false;

async function nextCat() {
    if (isLoading) return;
    isLoading = true;

    status.style.display = 'block';
    status.textContent = 'Загружаем кота...';
    img.classList.remove('loaded');
    img.removeAttribute('src');

    try {
        // Обход агрессивного кэширования мобильных операторов
        const res = await fetch(`https://api.thecatapi.com/v1/images/search?_=${Date.now()}`, {
            cache: 'no-store',
            headers: {
                // Если ошибка 429 (лимит) будет повторяться, зарегистрируйте бесплатный 
                // ключ на thecatapi.com и раскомментируйте строку ниже:
                // 'x-api-key': 'ВАШ_API_КЛЮЧ'
            }
        });

        if (!res.ok) {
            if (res.status === 429) {
                throw new Error('limit');
            }
            throw new Error('network');
        }

        const data = await res.json();
        const url = data[0].url;

        img.onload = () => {
            status.style.display = 'none';
            img.classList.add('loaded');
            isLoading = false;
        };

        img.onerror = () => {
            status.textContent = 'Ошибка загрузки кота.';
            isLoading = false;
        };

        // Обходим кэш провайдера для самой картинки
        img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    } catch (e) {
        status.textContent = e.message === 'limit' 
            ? 'Лимит сети. Нужен API-ключ' 
            : 'Не удалось получить кота.';
        isLoading = false;
    }
}

async function saveCat() {
    if (!img.src || !img.classList.contains('loaded')) return;

    status.style.display = 'block';
    status.textContent = 'Сохраняем...';

    try {
        // URL картинки уже содержит параметр 't', поэтому просто берем его
        const response = await fetch(img.src);
        
        if (!response.ok) throw new Error('Network error');
        
        const blob = await response.blob();
        const fileName = `cat_${Date.now()}.jpg`;
        const file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            status.style.display = 'none';
            await navigator.share({ files: [file] });
        } else {
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = fileName;
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                window.URL.revokeObjectURL(blobUrl);
                a.remove();
            }, 100);
            status.style.display = 'none';
        }
    } catch (e) {
        status.style.display = 'none';
        alert('Чтобы сохранить, зажмите картинку пальцем на пару секунд и выберите «Сохранить» в меню.');
    }
}

// первый кот при старте
nextCat();
</script>
